[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FileStorageTGBot"
version = "0.1.0"
description = "Telegram бот - облачное хранилище"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11,<4.0",
    "aiogram>=3.28,<4.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "colorlog>=6.10,<7.0",
    "aiofiles>=25.1,<26.0",
    "aiohttp>=3.13,<4.0",
    "cachetools>=6.1,<7.0",
    "colorama>=0.4,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pytz>=2025.2,<2026.0",
]

[tool.setuptools.packages.find]
include = ["tgbot*"]
exclude = ["migrations*"]
